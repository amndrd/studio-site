<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>macOS · Safari · GitHub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1728px;height:1117px;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
.menubar{height:37px;background:#1c1c1e;color:#f2f2f2;display:flex;align-items:center;padding:0 18px;font-size:13.5px;gap:20px;position:relative}
.menubar b{font-weight:700}
.menubar .r{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13.5px}
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:122px;height:32px;background:#000;border-radius:0 0 12px 12px}
.toolbar{height:52px;background:#2a2a2c;border-bottom:1px solid #000;display:flex;align-items:center;padding:0 16px;gap:14px;color:#a1a1a6}
.lights{display:flex;gap:8px;margin-right:10px}.lights i{width:12px;height:12px;border-radius:6px;display:block}
.url{position:absolute;left:50%;transform:translateX(-50%);width:560px;height:32px;border-radius:9px;background:#1c1c1e;color:#e5e5e7;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.tr{margin-left:auto;display:flex;gap:18px;font-size:17px}
img{display:block;width:1728px;height:1028px}
</style></head><body>
<div class="menubar"><b>Safari</b><span>File</span><span>Edit</span><span>View</span><span>History</span><span>Bookmarks</span><span>Window</span><span>Help</span>
  <div class="notch"></div>
  <div class="r"><span class="codicon codicon-record" style="font-size:12px"></span><span class="codicon codicon-search" style="font-size:14px"></span><span class="codicon codicon-settings" style="font-size:14px"></span><span style="font-size:12px;border:1.3px solid #f2f2f2;border-radius:3px;width:24px;height:12px;display:inline-block;position:relative"><i style="position:absolute;left:1px;top:1px;bottom:1px;width:15px;background:#f2f2f2;border-radius:1px"></i></span><span>Sun 15 Nov&nbsp;&nbsp;01:19</span></div></div>
<div class="toolbar" style="position:relative"><div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <span class="codicon codicon-layout-sidebar-left" style="font-size:17px"></span><span class="codicon codicon-chevron-left" style="font-size:18px"></span><span class="codicon codicon-chevron-right" style="font-size:18px;opacity:.4"></span>
  <div class="url"><span class="codicon codicon-lock" style="font-size:12px;color:#8e8e93"></span>github.com/amndrd<span class="codicon codicon-refresh" style="font-size:12px;color:#8e8e93;margin-left:auto;position:absolute;right:12px"></span></div>
  <div class="tr"><span class="codicon codicon-cloud-upload"></span><span class="codicon codicon-add"></span><span class="codicon codicon-copy"></span></div></div>
<img src="github-profil.png">
<script>document.body.dataset.ready='1'</script>
</body></html>
